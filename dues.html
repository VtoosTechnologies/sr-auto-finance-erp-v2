<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>
        Due Management | SR Auto Finance ERP
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f1f5f9;

            color: #1e293b;

        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            height: 70px;

            background: #0f172a;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            position: sticky;

            top: 0;

            z-index: 100;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.15);

        }


        .brand-area {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand-logo {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0ea5e9
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 15px;

            font-weight: 800;

        }


        .brand-text h1 {

            font-size: 16px;

            font-weight: 800;

        }


        .brand-text p {

            font-size: 10px;

            color: #94a3b8;

            margin-top: 2px;

        }


        .back-btn {

            border:
                1px solid
                #475569;

            background: transparent;

            color: white;

            padding:
                9px 13px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 12px;

        }


        .back-btn:hover {

            background: #1e293b;

        }


        /* =========================================
           MAIN
        ========================================= */

        .main {

            max-width: 1400px;

            margin: auto;

            padding: 25px;

        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 22px;

        }


        .page-title h2 {

            font-size: 25px;

            font-weight: 800;

            color: #0f172a;

        }


        .page-title p {

            color: #64748b;

            font-size: 12px;

            margin-top: 5px;

        }


        .collect-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0ea5e9
                );

            color: white;

            padding:
                12px 18px;

            border-radius: 10px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(37,99,235,0.22);

        }


        /* =========================================
           SUMMARY
        ========================================= */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;

        }


        .summary-card {

            background: white;

            border:
                1px solid
                #e2e8f0;

            border-radius: 15px;

            padding: 18px;

        }


        .summary-title {

            font-size: 11px;

            color: #64748b;

            font-weight: 600;

        }


        .summary-value {

            font-size: 22px;

            font-weight: 800;

            color: #0f172a;

            margin-top: 8px;

        }


        .summary-value.blue {

            color: #2563eb;

        }


        .summary-value.red {

            color: #dc2626;

        }


        .summary-value.green {

            color: #15803d;

        }


        /* =========================================
           FILTER TOOLBAR
        ========================================= */

        .toolbar {

            background: white;

            border:
                1px solid
                #e2e8f0;

            border-radius: 15px;

            padding: 15px;

            margin-bottom: 18px;

        }


        .toolbar-grid {

            display: grid;

            grid-template-columns:
                1fr
                170px
                170px
                150px;

            gap: 10px;

        }


        .search-box {

            position: relative;

        }


        .search-icon {

            position: absolute;

            left: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #64748b;

        }


        .search-input,
        .filter-select {

            width: 100%;

            height: 45px;

            border:
                1px solid
                #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 13px;

            background: #f8fafc;

        }


        .search-input {

            padding:
                0 15px 0 40px;

        }


        .filter-select {

            padding:
                0 12px;

        }


        .search-input:focus,
        .filter-select:focus {

            border-color: #2563eb;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.08);

        }


        /* =========================================
           TABLE
        ========================================= */

        .table-card {

            background: white;

            border:
                1px solid
                #e2e8f0;

            border-radius: 15px;

            overflow: hidden;

        }


        .table-wrapper {

            width: 100%;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1050px;

        }


        thead {

            background: #f8fafc;

        }


        th {

            text-align: left;

            padding:
                14px 16px;

            font-size: 10px;

            color: #64748b;

            text-transform: uppercase;

            letter-spacing: 0.3px;

            border-bottom:
                1px solid
                #e2e8f0;

        }


        td {

            padding:
                14px 16px;

            font-size: 12px;

            border-bottom:
                1px solid
                #f1f5f9;

        }


        tbody tr:hover {

            background: #f8fafc;

        }


        .loan-id {

            color: #2563eb;

            font-weight: 700;

        }


        .customer-name {

            color: #0f172a;

            font-weight: 700;

        }


        .amount {

            font-weight: 800;

        }


        .due-date {

            font-weight: 700;

        }


        .due-date.today {

            color: #2563eb;

        }


        .due-date.overdue {

            color: #dc2626;

        }


        .due-date.upcoming {

            color: #15803d;

        }


        .due-status {

            display: inline-block;

            padding:
                5px 9px;

            border-radius: 20px;

            font-size: 10px;

            font-weight: 700;

        }


        .due-status.today {

            background: #dbeafe;

            color: #1d4ed8;

        }


        .due-status.overdue {

            background: #fee2e2;

            color: #b91c1c;

        }


        .due-status.upcoming {

            background: #dcfce7;

            color: #15803d;

        }


        .due-status.paid {

            background: #e2e8f0;

            color: #475569;

        }


        .action-btn {

            border:
                1px solid
                #cbd5e1;

            background: white;

            color: #334155;

            padding:
                6px 9px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 11px;

        }


        .action-btn:hover {

            border-color: #2563eb;

            color: #2563eb;

        }


        .collect-small {

            border: none;

            background: #2563eb;

            color: white;

            padding:
                7px 10px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 11px;

            font-weight: 700;

        }


        .collect-small:hover {

            background: #1d4ed8;

        }


        /* =========================================
           EMPTY
        ========================================= */

        .empty-state {

            text-align: center;

            padding:
                55px 20px;

            color: #94a3b8;

        }


        .empty-icon {

            font-size: 35px;

            margin-bottom: 10px;

        }


        .empty-state p {

            font-size: 12px;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 1000px) {

            .summary-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .toolbar-grid {

                grid-template-columns:
                    1fr
                    1fr;

            }

        }


        @media (max-width: 600px) {

            .header {

                height: 64px;

                padding: 0 14px;

            }


            .brand-text p {

                display: none;

            }


            .main {

                padding:
                    18px 14px;

            }


            .page-header {

                align-items:
                    flex-start;

            }


            .page-title h2 {

                font-size: 21px;

            }


            .collect-btn {

                padding:
                    10px 12px;

                font-size: 11px;

            }


            .summary-grid {

                gap: 9px;

            }


            .summary-card {

                padding:
                    14px 12px;

            }


            .summary-value {

                font-size: 19px;

            }


            .toolbar-grid {

                grid-template-columns:
                    1fr;

            }

        }


        @media (max-width: 380px) {

            .summary-grid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">


    <div class="brand-area">

        <div class="brand-logo">
            SR
        </div>


        <div class="brand-text">

            <h1>
                SR Auto Finance
            </h1>

            <p>
                Finance Management ERP
            </p>

        </div>

    </div>


    <button
        class="back-btn"
        onclick="location.href='dashboard.html'"
    >
        ← Dashboard
    </button>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="main">


    <!-- PAGE HEADER -->

    <section class="page-header">


        <div class="page-title">

            <h2>
                Due Management
            </h2>

            <p>
                Track today's dues, upcoming payments and overdue accounts
            </p>

        </div>


        <button
            class="collect-btn"
            onclick="location.href='collection-form.html'"
        >
            + Collect Payment
        </button>


    </section>



    <!-- =========================================
         SUMMARY
    ========================================== -->

    <section class="summary-grid">


        <div class="summary-card">

            <div class="summary-title">
                Today's Due
            </div>

            <div
                class="summary-value blue"
                id="todayDue"
            >
                ₹0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Overdue
            </div>

            <div
                class="summary-value red"
                id="overdueDue"
            >
                ₹0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Upcoming
            </div>

            <div
                class="summary-value green"
                id="upcomingDue"
            >
                ₹0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Total Due Accounts
            </div>

            <div
                class="summary-value"
                id="totalDueAccounts"
            >
                0
            </div>

        </div>


    </section>



    <!-- =========================================
         FILTER TOOLBAR
    ========================================== -->

    <section class="toolbar">


        <div class="toolbar-grid">


            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>


                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search Loan ID, customer or mobile..."
                    autocomplete="off"
                >

            </div>


            <select
                id="statusFilter"
                class="filter-select"
            >

                <option value="">
                    All Due Status
                </option>

                <option value="overdue">
                    Overdue
                </option>

                <option value="today">
                    Today
                </option>

                <option value="upcoming">
                    Upcoming
                </option>

            </select>


            <input
                type="date"
                id="dateFilter"
                class="filter-select"
            >


            <select
                id="frequencyFilter"
                class="filter-select"
            >

                <option value="">
                    All Frequency
                </option>

                <option value="Daily">
                    Daily
                </option>

                <option value="Weekly">
                    Weekly
                </option>

                <option value="Monthly">
                    Monthly
                </option>

            </select>


        </div>

    </section>



    <!-- =========================================
         DUE TABLE
    ========================================== -->

    <section class="table-card">


        <div class="table-wrapper">


            <table>


                <thead>

                    <tr>

                        <th>
                            Loan ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Due Date
                        </th>

                        <th>
                            Due Amount
                        </th>

                        <th>
                            Frequency
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="dueTableBody"
                >

                    <tr>

                        <td colspan="8">

                            <div
                                class="empty-state"
                            >

                                <div
                                    class="empty-icon"
                                >
                                    ⏳
                                </div>

                                <p>
                                    Loading dues...
                                </p>

                            </div>

                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </section>


</main>



<script
    type="module"
    src="js/dues.js"
></script>


</body>

</html>
