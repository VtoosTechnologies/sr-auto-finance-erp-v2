<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f172a">
    <title>Login | SR Auto Finance ERP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            padding: 35px 32px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .brand-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 18px;
            border-radius: 21px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .brand-title {
            color: #0f172a;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .brand-subtitle {
            color: #64748b;
            font-size: 13px;
        }

        .welcome {
            margin-bottom: 22px;
        }

        .welcome h2 {
            color: #1e293b;
            font-size: 21px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #64748b;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: #64748b;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 0 14px 0 43px;
            font-size: 14px;
            outline: none;
            color: #1e293b;
            background: #f8fafc;
            transition: 0.2s;
        }

        .input-box input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .password-toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            color: #64748b;
        }

        .login-btn {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 25px rgba(37, 99, 235, 0.32);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 11px 13px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .security {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            color: #64748b;
            font-size: 11px;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-card {
                padding: 30px 22px;
                border-radius: 21px;
            }

            .brand-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <div class="brand-section">

                <div class="logo">
                    SR
                </div>

                <div class="brand-title">
                    SR Auto Finance
                </div>

                <div class="brand-subtitle">
                    Finance Management ERP
                </div>

            </div>


            <div class="welcome">
                <h2>Welcome Back</h2>
                <p>Sign in to access your ERP dashboard</p>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username / Email
                    </label>

                    <div class="input-box">

                        <span>👤</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username or email"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Sign In
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="security">
                🔐 Secure ERP Access
            </div>

        </div>


        <div class="footer">
            © 2026 SR Auto Finance ERP
        </div>

    </div>


    <script>

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                togglePassword.textContent = "🙈";

            } else {

                passwordInput.type = "password";
                togglePassword.textContent = "👁";

            }

        });


        const loginForm =
            document.getElementById("loginForm");

        const loginBtn =
            document.getElementById("loginBtn");

        const message =
            document.getElementById("message");

</script>
   <script type="module" src="js/login.js"></script>

</body>
</html>
