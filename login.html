<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic Meta -->
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SR Auto Finance ERP | Login</title>

    <!-- SEO -->
    <meta name="description"
          content="SR Auto Finance ERP - Developed by VTOOS Software Solutions">

    <meta name="theme-color"
          content="#2563EB">

    <!-- PWA -->
    <link rel="manifest"
          href="./manifest.json">

    <!-- Favicon -->
    <link rel="icon"
          type="image/png"
          href="./assets/logo/favicon.png">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">

    <!-- Global CSS -->
    <link rel="stylesheet"
          href="../css/common.css">

    <!-- Page CSS -->
    <link rel="stylesheet"
          href="../css/login.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- Login Page Wrapper                                     -->
    <!-- ===================================================== -->

    <main class="login-page">

        <!-- Background Shapes -->
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>

        <!-- Login Card -->
        <section class="login-card">

            <!-- Logo Area -->
            <div class="login-header">

                <img src="./assets/logo/logo.png"
                     alt="SR Auto Finance Logo"
                     class="company-logo">

                <h1>
                    SR Auto Finance
                </h1>

                <p>
                    Finance ERP Management System
                </p>

            </div>

            <!-- Welcome Text -->
            <div class="welcome-area">

                <h2>
                    Welcome Back 👋
                </h2>

                <span>
                    Login to continue
                </span>

            </div>

            <!-- Login Form Starts -->
            <form id="loginForm" autocomplete="off">
                              <!-- Username -->
         <!-- Email -->
<div class="form-group">

    <label for="username">
        Email
    </label>

    <div class="input-box">

        <span class="material-symbols-rounded">
            person
        </span>

        <input
            type="email"
            id="username"
            name="username"
            placeholder="Enter Email"
            required>

    </div>

</div>

<!-- Password -->
<div class="form-group">

    <label for="password">
        Password
    </label>

    <div class="input-box">

        <span class="material-symbols-rounded">
            lock
        </span>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            required>

        <button
            type="button"
            id="togglePassword"
            class="password-toggle">

            <span class="material-symbols-rounded">
                visibility
            </span>

        </button>

    </div>

</div>

                <!-- Remember Me -->

                <div class="remember-section">

                    <label class="remember-box">

                        <input type="checkbox"
                               id="rememberMe">

                        <span>
                            Remember Me
                        </span>

                    </label>

                </div>

                <!-- Login Button -->

                <button type="submit"
                        class="login-btn">

                    <span class="material-symbols-rounded">
                        login
                    </span>

                    Login

                </button>

            </form>

            <!-- End Login Form -->
                      <!-- Login Status Message -->

            <div id="loginMessage"
                 class="login-message">
            </div>

            <!-- Version -->

            <div class="app-version">

                <span>
                    Version 1.0.0
                </span>

            </div>

        </section>

    </main>

    <!-- ===================================================== -->
    <!-- Footer -->
    <!-- ===================================================== -->

    <footer class="login-footer">

        <p>

            Developed with ❤️ by

            <strong>
                VTOOS Software Solutions
            </strong>

        </p>

    </footer>

    <!-- ===================================================== -->
    <!-- Loading Overlay -->
    <!-- ===================================================== -->

    <div id="loadingOverlay"
         class="loading-overlay">

        <div class="loader"></div>

        <p>
            Signing In...
        </p>

    </div>

    <!-- ===================================================== -->
    <!-- Firebase -->
    <!-- ===================================================== -->

    <script type="module"
            src="./js/firebase.js"></script>

    <!-- ===================================================== -->
    <!-- Authentication -->
    <!-- ===================================================== -->

    <script type="module"
            src="./js/auth.js"></script>

</body>

</html>
