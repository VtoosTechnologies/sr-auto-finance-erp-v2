<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Customers - SR Auto Finance
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f1f5f9;

            color: #0f172a;

        }


        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {

            height: 68px;

            background: #ffffff;

            border-bottom:
                1px solid #e2e8f0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 24px;

            position: sticky;

            top: 0;

            z-index: 20;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .logo {

            width: 42px;

            height: 42px;

            border-radius: 11px;

            background: #2563eb;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 800;

        }


        .brand-title {

            font-size: 16px;

            font-weight: 800;

        }


        .brand-subtitle {

            font-size: 11px;

            color: #64748b;

            margin-top: 2px;

        }


        .top-actions {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .back-btn,
        .logout-btn {

            border: 0;

            padding:
                9px 13px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

        }


        .back-btn {

            background: #eff6ff;

            color: #1d4ed8;

        }


        .logout-btn {

            background: #fee2e2;

            color: #b91c1c;

        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            max-width: 1350px;

            margin: 0 auto;

            padding:
                24px;

        }


        .page-header {

            display: flex;

            justify-content:
                space-between;

            align-items: flex-end;

            gap: 20px;

            margin-bottom: 20px;

        }


        .page-header h1 {

            margin: 0;

            font-size: 24px;

        }


        .page-header p {

            margin:
                6px 0 0;

            font-size: 13px;

            color: #64748b;

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-card {

            background: #ffffff;

            border:
                1px solid #e2e8f0;

            border-radius: 14px;

            padding: 16px;

            margin-bottom: 18px;

        }


        .search-row {

            display: flex;

            gap: 10px;

        }


        .search-input {

            flex: 1;

            height: 44px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            padding:
                0 13px;

            font-size: 13px;

            outline: none;

        }


        .search-input:focus {

            border-color:
                #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );

        }


        .search-btn {

            height: 44px;

            padding:
                0 20px;

            border: 0;

            border-radius: 8px;

            background: #2563eb;

            color: #ffffff;

            font-weight: 700;

            cursor: pointer;

        }


        .clear-btn {

            height: 44px;

            padding:
                0 17px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            background: #ffffff;

            color: #334155;

            font-weight: 700;

            cursor: pointer;

        }


        /* =====================================================
           CUSTOMER LIST
        ===================================================== */

        .content-grid {

            display: grid;

            grid-template-columns:
                360px
                minmax(
                    0,
                    1fr
                );

            gap: 18px;

            align-items: start;

        }


        .panel {

            background: #ffffff;

            border:
                1px solid #e2e8f0;

            border-radius: 14px;

            overflow: hidden;

        }


        .panel-header {

            padding:
                16px 18px;

            border-bottom:
                1px solid #e2e8f0;

        }


        .panel-title {

            margin: 0;

            font-size: 15px;

            font-weight: 800;

        }


        .panel-subtitle {

            margin:
                4px 0 0;

            font-size: 11px;

            color: #64748b;

        }


        .customer-list {

            max-height: 650px;

            overflow-y: auto;

        }


        .customer-item {

            width: 100%;

            border: 0;

            border-bottom:
                1px solid #f1f5f9;

            background: #ffffff;

            padding:
                14px 16px;

            text-align: left;

            cursor: pointer;

        }


        .customer-item:hover {

            background: #f8fafc;

        }


        .customer-item.active {

            background: #eff6ff;

            border-left:
                4px solid #2563eb;

            padding-left: 12px;

        }


        .customer-name {

            font-size: 13px;

            font-weight: 800;

            color: #0f172a;

        }


        .customer-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 7px;

        }


        .badge {

            display: inline-flex;

            align-items: center;

            padding:
                4px 7px;

            border-radius: 5px;

            font-size: 10px;

            font-weight: 700;

            background: #f1f5f9;

            color: #475569;

        }


        .badge.blue {

            background: #dbeafe;

            color: #1d4ed8;

        }


        .badge.green {

            background: #dcfce7;

            color: #15803d;

        }


        .badge.orange {

            background: #ffedd5;

            color: #c2410c;

        }


        .empty {

            padding: 35px 20px;

            text-align: center;

            color: #64748b;

            font-size: 12px;

        }


        /* =====================================================
           CUSTOMER DETAILS
        ===================================================== */

        .details-panel {

            min-width: 0;

        }


        .customer-header {

            padding:
                20px;

            border-bottom:
                1px solid #e2e8f0;

        }


        .customer-header-top {

            display: flex;

            justify-content:
                space-between;

            gap: 15px;

            align-items: flex-start;

        }


        .customer-main-name {

            margin: 0;

            font-size: 21px;

        }


        .customer-main-meta {

            margin-top: 6px;

            color: #64748b;

            font-size: 12px;

        }


        .collect-main-btn {

            border: 0;

            background: #16a34a;

            color: #ffffff;

            padding:
                11px 16px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            white-space: nowrap;

        }


        .customer-info-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 10px;

            margin-top: 18px;

        }


        .info-card {

            background: #f8fafc;

            border-radius: 9px;

            padding: 12px;

        }


        .info-label {

            font-size: 10px;

            color: #64748b;

            font-weight: 700;

        }


        .info-value {

            margin-top: 5px;

            font-size: 14px;

            font-weight: 800;

        }


        /* =====================================================
           LOAN CARDS
        ===================================================== */

        .loans-section {

            padding: 18px;

        }


        .loan-card {

            border:
                1px solid #e2e8f0;

            border-radius: 12px;

            margin-bottom: 15px;

            overflow: hidden;

        }


        .loan-card:last-child {

            margin-bottom: 0;

        }


        .loan-header {

            padding:
                15px 16px;

            background: #f8fafc;

            border-bottom:
                1px solid #e2e8f0;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 10px;

        }


        .loan-number {

            font-size: 14px;

            font-weight: 800;

        }


        .loan-status {

            padding:
                5px 9px;

            border-radius: 6px;

            font-size: 10px;

            font-weight: 800;

            background: #dcfce7;

            color: #15803d;

        }


        .loan-status.closed {

            background: #e2e8f0;

            color: #475569;

        }


        .loan-summary {

            display: grid;

            grid-template-columns:
                repeat(
                    5,
                    minmax(
                        0,
                        1fr
                    )
                );

            padding: 15px;

            gap: 10px;

        }


        .loan-stat {

            background: #ffffff;

            border:
                1px solid #f1f5f9;

            border-radius: 8px;

            padding: 10px;

        }


        .loan-stat-label {

            font-size: 9px;

            color: #64748b;

            font-weight: 700;

        }


        .loan-stat-value {

            margin-top: 5px;

            font-size: 13px;

            font-weight: 800;

        }


        /* =====================================================
           SCHEDULE
        ===================================================== */

        .schedule-section {

            border-top:
                1px solid #e2e8f0;

            padding: 15px;

        }


        .schedule-title {

            font-size: 13px;

            font-weight: 800;

            margin-bottom: 11px;

        }


        .table-wrap {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse:
                collapse;

            min-width: 850px;

        }


        th {

            background: #f8fafc;

            color: #475569;

            font-size: 9px;

            text-align: left;

            padding:
                9px 8px;

            white-space: nowrap;

        }


        td {

            padding:
                9px 8px;

            border-top:
                1px solid #f1f5f9;

            font-size: 10px;

            white-space: nowrap;

        }


        .status {

            display: inline-block;

            padding:
                4px 7px;

            border-radius: 5px;

            font-size: 9px;

            font-weight: 800;

        }


        .status.paid {

            background: #dcfce7;

            color: #15803d;

        }


        .status.due {

            background: #ffedd5;

            color: #c2410c;

        }


        .status.partial {

            background: #fef3c7;

            color: #a16207;

        }


        .status.overdue {

            background: #fee2e2;

            color: #b91c1c;

        }


        .status.upcoming {

            background: #e0f2fe;

            color: #0369a1;

        }


        .collect-btn {

            border: 0;

            background: #16a34a;

            color: white;

            padding:
                6px 9px;

            border-radius: 5px;

            font-size: 9px;

            font-weight: 800;

            cursor: pointer;

        }


        .collect-btn:disabled {

            background: #cbd5e1;

            cursor: not-allowed;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.25
                );

            align-items: center;

            justify-content: center;

            z-index: 100;

        }


        .loading-box {

            background: #ffffff;

            padding:
                20px 26px;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 700;

            box-shadow:
                0 15px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.2
                );

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (
            max-width: 1050px
        ) {

            .content-grid {

                grid-template-columns:
                    300px
                    minmax(
                        0,
                        1fr
                    );

            }


            .loan-summary {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(
                            0,
                            1fr
                        )
                    );

            }

        }


        @media (
            max-width: 800px
        ) {

            .content-grid {

                grid-template-columns:
                    1fr;

            }


            .customer-list {

                max-height: 350px;

            }


            .customer-info-grid {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }

        }


        @media (
            max-width: 600px
        ) {

            .topbar {

                padding:
                    0 12px;

            }


            .page {

                padding:
                    14px;

            }


            .brand-subtitle {

                display: none;

            }


            .page-header {

                display: block;

            }


            .search-row {

                flex-wrap: wrap;

            }


            .search-input {

                flex-basis:
                    100%;

            }


            .customer-header-top {

                display: block;

            }


            .collect-main-btn {

                margin-top: 14px;

            }


            .customer-info-grid {

                grid-template-columns:
                    1fr 1fr;

            }


            .loan-summary {

                grid-template-columns:
                    1fr 1fr;

            }


        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOPBAR
    ====================================================== -->

    <header class="topbar">


        <div class="brand">

            <div class="logo">
                SR
            </div>


            <div>

                <div class="brand-title">
                    SR Auto Finance
                </div>

                <div class="brand-subtitle">
                    Staff Portal
                </div>

            </div>

        </div>


        <div class="top-actions">


            <button
                type="button"
                class="back-btn"
                id="backBtn"
            >
                ← Dashboard
            </button>


            <button
                type="button"
                class="logout-btn"
                id="logoutBtn"
            >
                Logout
            </button>


        </div>


    </header>



    <!-- =====================================================
         PAGE
    ====================================================== -->

    <main class="page">


        <section class="page-header">

            <div>

                <h1>
                    My Customers
                </h1>

                <p>
                    View assigned customers, loans and repayment details.
                </p>

            </div>

        </section>



        <!-- =================================================
             SEARCH
        ================================================== -->

        <section class="search-card">


            <div class="search-row">


                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search customer name, mobile, customer ID or loan ID"
                >


                <button
                    type="button"
                    class="search-btn"
                    id="searchBtn"
                >
                    Search
                </button>


                <button
                    type="button"
                    class="clear-btn"
                    id="clearBtn"
                >
                    Clear
                </button>


            </div>


        </section>



        <!-- =================================================
             CONTENT
        ================================================== -->

        <section class="content-grid">


            <!-- =============================================
                 CUSTOMER LIST
            ============================================== -->

            <div class="panel">


                <div class="panel-header">

                    <h2 class="panel-title">
                        Assigned Customers
                    </h2>

                    <p class="panel-subtitle">
                        Select a customer to view loan details
                    </p>

                </div>


                <div
                    class="customer-list"
                    id="customerList"
                >

                    <div class="empty">
                        Loading customers...
                    </div>

                </div>


            </div>



            <!-- =============================================
                 CUSTOMER DETAILS
            ============================================== -->

            <div class="panel details-panel">


                <div
                    id="customerDetails"
                >

                    <div class="empty">

                        Select a customer from the list.

                    </div>

                </div>


            </div>


        </section>


    </main>



    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
        class="loading"
        id="loadingOverlay"
    >

        <div class="loading-box">
            Loading customer details...
        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/staff-customers.js"
    ></script>


</body>

</html>
