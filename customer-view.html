<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">

    <title>Customer Profile | SR Auto Finance ERP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* HEADER */

        .header {
            height: 70px;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
        }

        .brand-text h1 {
            font-size: 16px;
        }

        .brand-text p {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .back-btn {
            border: 1px solid #475569;
            background: transparent;
            color: white;
            padding: 9px 13px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
        }

        .back-btn:hover {
            background: #1e293b;
        }


        /* MAIN */

        .main {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }


        /* PROFILE HEADER */

        .profile-header {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 800;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
        }

        .customer-id {
            margin-top: 5px;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
        }

        .status {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 20px;
            background: #dcfce7;
            color: #15803d;
            font-size: 10px;
            font-weight: 700;
        }

        .edit-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }


        /* GRID */

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
        }

        .card.full {
            grid-column: 1 / -1;
        }

        .card-title {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            padding-bottom: 12px;
            margin-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-label {
            color: #94a3b8;
            font-size: 10px;
            margin-bottom: 4px;
        }

        .info-value {
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            word-break: break-word;
        }


        /* LOAN EMPTY */

        .empty-state {
            text-align: center;
            padding: 28px 10px;
            color: #94a3b8;
        }

        .empty-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 12px;
        }


        /* LOADING */

        .loading {
            text-align: center;
            padding: 70px 20px;
            color: #64748b;
            font-size: 13px;
        }


        /* ERROR */

        .error {
            text-align: center;
            padding: 60px 20px;
            color: #b91c1c;
            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .header {
                height: 64px;
                padding: 0 14px;
            }

            .brand-text p {
                display: none;
            }

            .main {
                padding: 16px 14px;
            }

            .profile-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .profile-left {
                width: 100%;
            }

            .profile-name {
                font-size: 19px;
            }

            .edit-btn {
                width: 100%;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .card.full {
                grid-column: auto;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>


<body>


<header class="header">

    <div class="brand-area">

        <div class="brand-logo">
            SR
        </div>

        <div class="brand-text">

            <h1>
                SR Auto Finance
            </h1>

            <p>
                Finance Management ERP
            </p>

        </div>

    </div>


    <button
        class="back-btn"
        onclick="location.href='customers.html'"
    >
        ← Customers
    </button>

</header>



<main class="main">

    <div id="pageContent">

        <div class="loading">
            Loading customer profile...
        </div>

    </div>

</main>



<script
    type="module"
    src="js/customer-view.js"
></script>


</body>
</html>
