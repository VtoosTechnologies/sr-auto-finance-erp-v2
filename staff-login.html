<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Staff Login - SR Auto Finance
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .login-card {

            width: 100%;

            max-width: 420px;

            background: #ffffff;

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 20px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

        }


        .brand {

            text-align: center;

            margin-bottom: 28px;

        }


        .logo {

            width: 64px;

            height: 64px;

            margin:
                0 auto 14px;

            border-radius: 18px;

            background: #2563eb;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            font-weight: 800;

        }


        .brand h1 {

            margin: 0;

            font-size: 22px;

            color: #0f172a;

        }


        .brand p {

            margin:
                6px 0 0;

            font-size: 13px;

            color: #64748b;

        }


        .staff-badge {

            display: inline-block;

            margin-top: 12px;

            padding:
                6px 12px;

            border-radius: 20px;

            background: #eff6ff;

            color: #1d4ed8;

            font-size: 11px;

            font-weight: 700;

        }


        .form-group {

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 700;

            color: #334155;

        }


        input {

            width: 100%;

            height: 46px;

            border:
                1px solid
                #cbd5e1;

            border-radius: 9px;

            padding:
                0 13px;

            font-size: 14px;

            outline: none;

        }


        input:focus {

            border-color:
                #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );

        }


        .login-btn {

            width: 100%;

            height: 48px;

            border: 0;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 5px;

        }


        .login-btn:hover {

            background: #1d4ed8;

        }


        .login-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }


        .message {

            display: none;

            margin-bottom: 15px;

            padding:
                11px 12px;

            border-radius: 8px;

            font-size: 12px;

            line-height: 1.5;

        }


        .message.error {

            display: block;

            background: #fef2f2;

            color: #b91c1c;

            border:
                1px solid
                #fecaca;

        }


        .message.success {

            display: block;

            background: #f0fdf4;

            color: #15803d;

            border:
                1px solid
                #bbf7d0;

        }


        .footer {

            text-align: center;

            margin-top: 22px;

            font-size: 11px;

            color: #94a3b8;

        }

    </style>

</head>


<body>


    <div class="login-card">


        <div class="brand">


            <div class="logo">
                SR
            </div>


            <h1>
                SR Auto Finance
            </h1>


            <p>
                Staff Portal
            </p>


            <span class="staff-badge">
                STAFF LOGIN
            </span>


        </div>


        <div
            id="message"
            class="message"
        ></div>


        <form
            id="staffLoginForm"
        >

<div class="form-group">

    <label
        for="email"
    >
        Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="username"
        required
    >

</div>

            <div class="form-group">

                <label
                    for="password"
                >
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>
<div
    style="
        text-align:center;
        margin-top:16px;
        font-size:12px;
        color:#64748b;
    "
>
    First time login?

    <button
        type="button"
        id="createPasswordBtn"
        style="
            border:0;
            background:none;
            color:#2563eb;
            font-weight:700;
            cursor:pointer;
            padding:0;
        "
    >
        Create Password
    </button>
</div>

<div
    style="
        text-align:center;
        margin-top:9px;
        font-size:12px;
    "
>
    <button
        type="button"
        id="forgotPasswordBtn"
        style="
            border:0;
            background:none;
            color:#64748b;
            cursor:pointer;
            padding:0;
        "
    >
        Forgot Password?
    </button>
</div>

        </form>


        <div class="footer">

            SR Auto Finance ERP

        </div>


    </div>


    <script
        type="module"
        src="js/staff-login.js"
    ></script>


</body>

</html>
