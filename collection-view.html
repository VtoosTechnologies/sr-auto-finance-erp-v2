<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>
        Payment Receipt | SR Auto Finance ERP
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f1f5f9;

            color: #1e293b;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            height: 70px;

            background: #0f172a;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            position: sticky;

            top: 0;

            z-index: 100;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.15);

        }


        .brand-area {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand-logo {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0ea5e9
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 15px;

            font-weight: 800;

        }


        .brand-text h1 {

            font-size: 16px;

            font-weight: 800;

        }


        .brand-text p {

            font-size: 10px;

            color: #94a3b8;

            margin-top: 2px;

        }


        .header-actions {

            display: flex;

            gap: 8px;

        }


        .header-btn {

            border:
                1px solid
                #475569;

            background: transparent;

            color: white;

            padding:
                9px 13px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 12px;

        }


        .header-btn:hover {

            background: #1e293b;

        }


        /* =========================================
           MAIN
        ========================================= */

        .main {

            max-width: 900px;

            margin: auto;

            padding: 25px;

        }


        .loading {

            text-align: center;

            padding: 80px 20px;

            color: #64748b;

            font-size: 13px;

        }


        .error {

            text-align: center;

            padding: 70px 20px;

            color: #b91c1c;

            font-size: 13px;

        }


        /* =========================================
           RECEIPT
        ========================================= */

        .receipt {

            background: white;

            border:
                1px solid
                #dbe3ec;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 10px 30px
                rgba(15,23,42,0.08);

        }


        /* =========================================
           RECEIPT HEADER
        ========================================= */

        .receipt-header {

            padding: 25px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a
                );

            color: white;

            display: flex;

            justify-content: space-between;

            gap: 20px;

        }


        .company-name {

            font-size: 22px;

            font-weight: 800;

        }


        .company-subtitle {

            font-size: 11px;

            color: #cbd5e1;

            margin-top: 5px;

        }


        .receipt-title {

            text-align: right;

        }


        .receipt-title h2 {

            font-size: 20px;

            font-weight: 800;

        }


        .receipt-title p {

            font-size: 11px;

            color: #bfdbfe;

            margin-top: 5px;

        }


        /* =========================================
           RECEIPT BODY
        ========================================= */

        .receipt-body {

            padding: 25px;

        }


        .success-banner {

            display: flex;

            align-items: center;

            gap: 10px;

            background: #f0fdf4;

            border:
                1px solid
                #bbf7d0;

            color: #15803d;

            padding: 13px 15px;

            border-radius: 11px;

            margin-bottom: 20px;

            font-size: 12px;

            font-weight: 700;

        }


        .success-icon {

            width: 27px;

            height: 27px;

            border-radius: 50%;

            background: #22c55e;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;

        }


        /* =========================================
           AMOUNT
        ========================================= */

        .amount-box {

            text-align: center;

            padding: 22px;

            background: #f8fafc;

            border:
                1px solid
                #e2e8f0;

            border-radius: 14px;

            margin-bottom: 22px;

        }


        .amount-label {

            font-size: 11px;

            color: #64748b;

        }


        .amount-value {

            font-size: 32px;

            font-weight: 900;

            color: #15803d;

            margin-top: 7px;

        }


        /* =========================================
           INFO GRID
        ========================================= */

        .section {

            margin-bottom: 22px;

        }


        .section-title {

            font-size: 14px;

            font-weight: 800;

            color: #0f172a;

            padding-bottom: 10px;

            margin-bottom: 14px;

            border-bottom:
                1px solid
                #e2e8f0;

        }


        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;

        }


        .info-item {

            padding: 13px;

            background: #f8fafc;

            border:
                1px solid
                #e2e8f0;

            border-radius: 10px;

        }


        .info-label {

            font-size: 10px;

            color: #64748b;

            margin-bottom: 5px;

        }


        .info-value {

            font-size: 13px;

            font-weight: 700;

            color: #1e293b;

            word-break: break-word;

        }


        .info-value.blue {

            color: #2563eb;

        }


        .info-value.green {

            color: #15803d;

        }


        /* =========================================
           BALANCE
        ========================================= */

        .balance-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

        }


        .balance-card {

            padding: 16px;

            border-radius: 12px;

            background: white;

            border:
                1px solid
                #e2e8f0;

        }


        .balance-label {

            font-size: 10px;

            color: #64748b;

        }


        .balance-value {

            font-size: 18px;

            font-weight: 800;

            margin-top: 6px;

            color: #0f172a;

        }


        .balance-value.green {

            color: #15803d;

        }


        .balance-value.blue {

            color: #2563eb;

        }


        /* =========================================
           FOOTER
        ========================================= */

        .receipt-footer {

            padding: 20px 25px;

            border-top:
                1px solid
                #e2e8f0;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

        }


        .footer-note {

            font-size: 10px;

            color: #94a3b8;

            line-height: 1.5;

        }


        .print-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0ea5e9
                );

            color: white;

            padding:
                11px 18px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 700;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .header {

                height: 64px;

                padding: 0 14px;

            }


            .brand-text p {

                display: none;

            }


            .main {

                padding:
                    15px 12px;

            }


            .receipt-header {

                flex-direction:
                    column;

                padding: 20px;

            }


            .receipt-title {

                text-align: left;

            }


            .receipt-body {

                padding: 18px;

            }


            .info-grid {

                grid-template-columns:
                    1fr;

            }


            .balance-grid {

                grid-template-columns:
                    1fr;

            }


            .receipt-footer {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .print-btn {

                width: 100%;

            }


            .header-btn.back-btn {

                display: none;

            }

        }


        /* =========================================
           PRINT
        ========================================= */

        @media print {

            body {

                background: white;

            }


            .header {

                display: none;

            }


            .main {

                max-width: 100%;

                padding: 0;

            }


            .receipt {

                border: none;

                box-shadow: none;

                border-radius: 0;

            }


            .receipt-footer {

                display: none;

            }


            .receipt-header {

                background: #0f172a !important;

                -webkit-print-color-adjust:
                    exact;

                print-color-adjust:
                    exact;

            }

        }
.app-footer {
    text-align: center;
    padding: 20px 15px 25px;
    color: #94a3b8;
    font-size: 11px;
    line-height: 1.6;
}

.app-footer div:last-child {
    color: #64748b;
    font-weight: 600;
    font-size: 10px;
}
    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">


    <div class="brand-area">

        <div class="brand-logo">
            SR
        </div>


        <div class="brand-text">

            <h1>
                SR Auto Finance
            </h1>

            <p>
                Finance Management ERP
            </p>

        </div>

    </div>


    <div class="header-actions">

        <button
            class="header-btn back-btn"
            onclick="location.href='collections.html'"
        >
            ← Collections
        </button>


        <button
            class="header-btn"
            onclick="window.print()"
        >
            🖨 Print
        </button>

    </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="main">


    <div id="pageContent">

        <div class="loading">

            Loading payment receipt...

        </div>

    </div>


</main>



<script
    type="module"
    src="js/collection-view.js"
></script>
<footer class="app-footer">
    <div>© 2026 SR Auto Finance ERP</div>
    <div>Powered by VTOOS Software Solutions</div>
</footer>

</body>

</html>
