<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f172a">

    <title>Customers | SR Auto Finance ERP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* ==============================
           HEADER
        ============================== */

        .header {
            height: 70px;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 800;
        }

        .brand-text p {
            color: #94a3b8;
            font-size: 10px;
            margin-top: 2px;
        }

        .back-btn {
            border: 1px solid #475569;
            background: transparent;
            color: white;
            padding: 9px 13px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
        }

        .back-btn:hover {
            background: #1e293b;
        }


        /* ==============================
           MAIN
        ============================== */

        .main {
            max-width: 1400px;
            margin: auto;
            padding: 25px;
        }


        /* ==============================
           PAGE HEADER
        ============================== */

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 22px;
        }

        .page-title h2 {
            font-size: 25px;
            color: #0f172a;
            font-weight: 800;
        }

        .page-title p {
            color: #64748b;
            font-size: 12px;
            margin-top: 5px;
        }

        .add-btn {
            border: none;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(37,99,235,0.22);
        }

        .add-btn:hover {
            transform: translateY(-1px);
        }


        /* ==============================
           SUMMARY CARDS
        ============================== */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 18px;
        }

        .summary-title {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        .summary-value {
            font-size: 23px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 8px;
        }


        /* ==============================
           SEARCH PANEL
        ============================== */

        .toolbar {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .search-input {
            width: 100%;
            height: 45px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 0 15px 0 40px;
            outline: none;
            font-size: 13px;
            background: #f8fafc;
        }

        .search-input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }


        /* ==============================
           TABLE
        ============================== */

        .table-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            overflow: hidden;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        thead {
            background: #f8fafc;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 14px 16px;
            font-size: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .customer-id {
            font-weight: 700;
            color: #2563eb;
        }

        .customer-name {
            font-weight: 700;
            color: #0f172a;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }

        .status.active {
            background: #dcfce7;
            color: #15803d;
        }

        .status.inactive {
            background: #fee2e2;
            color: #b91c1c;
        }

        .action-btn {
            border: 1px solid #cbd5e1;
            background: white;
            color: #334155;
            padding: 6px 9px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
        }

        .action-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }


        /* ==============================
           EMPTY / LOADING
        ============================== */

        .empty-state {
            text-align: center;
            padding: 55px 20px;
            color: #94a3b8;
        }

        .empty-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 12px;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            .header {
                height: 64px;
                padding: 0 14px;
            }

            .brand-text p {
                display: none;
            }

            .main {
                padding: 18px 14px;
            }

            .page-header {
                align-items: flex-start;
            }

            .page-title h2 {
                font-size: 21px;
            }

            .add-btn {
                padding: 10px 12px;
                font-size: 11px;
            }

            .summary-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .summary-card {
                padding: 13px 10px;
            }

            .summary-title {
                font-size: 9px;
            }

            .summary-value {
                font-size: 18px;
            }
        }

        @media (max-width: 430px) {

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .summary-card {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .summary-value {
                margin-top: 0;
            }

            .back-btn {
                padding: 8px 10px;
            }
        }
    </style>
</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="brand-area">

        <div class="brand-logo">
            SR
        </div>

        <div class="brand-text">

            <h1>
                SR Auto Finance
            </h1>

            <p>
                Finance Management ERP
            </p>

        </div>

    </div>


    <button
        class="back-btn"
        onclick="location.href='dashboard.html'"
    >
        ← Dashboard
    </button>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="main">


    <!-- PAGE HEADER -->

    <section class="page-header">

        <div class="page-title">

            <h2>
                Customers
            </h2>

            <p>
                Manage customer information and accounts
            </p>

        </div>


        <button
            class="add-btn"
            onclick="location.href='customer-form.html'"
        >
            + Add Customer
        </button>

    </section>



    <!-- SUMMARY -->

    <section class="summary-grid">

        <div class="summary-card">

            <div class="summary-title">
                Total Customers
            </div>

            <div
                class="summary-value"
                id="totalCustomers"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Active
            </div>

            <div
                class="summary-value"
                id="activeCustomers"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Inactive
            </div>

            <div
                class="summary-value"
                id="inactiveCustomers"
            >
                0
            </div>

        </div>

    </section>



    <!-- SEARCH -->

    <section class="toolbar">

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="search"
                id="searchInput"
                class="search-input"
                placeholder="Search by customer ID, name or mobile..."
                autocomplete="off"
            >

        </div>

    </section>



    <!-- CUSTOMER TABLE -->

    <section class="table-card">

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Customer ID
                        </th>

                        <th>
                            Customer Name
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Location
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="customerTableBody">

                    <tr>

                        <td colspan="6">

                            <div class="empty-state">

                                <div class="empty-icon">
                                    ⏳
                                </div>

                                <p>
                                    Loading customers...
                                </p>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script
    type="module"
    src="js/customers.js"
></script>


</body>
</html>
